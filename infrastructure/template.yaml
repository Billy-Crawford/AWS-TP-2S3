AWSTemplateFormatVersion: '2010-09-09'
Description: "TP AWS Lambda - Code chargé depuis src/main.py"

Parameters:
  Environment:
    Type: String
    Default: "ongartobaye"

  BucketName:
    Type: String
    Default: "s3-bucket-trigger-lambda"

Resources:

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

      Policies:
        - PolicyName: !Sub "${Environment}-LambdaDynamoPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                Resource:
                  - arn:aws:dynamodb:*:*:table/s3-trigger-db

  LambdaTrigger:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${Environment}-S3LambdaTrigger"
      Handler: main.lambda_handler
      Runtime: python3.12
      Role: !GetAtt LambdaExecutionRole.Arn
      Code: ../src   # 👈 IMPORTANT (source locale OK avant package)

  LambdaPermissionForS3:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LambdaTrigger
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::${Environment}-${BucketName}"
      SourceAccount: !Ref AWS::AccountId

  S3Bucket:
    Type: AWS::S3::Bucket
    DependsOn: LambdaPermissionForS3
    Properties:
      BucketName: !Sub "${Environment}-${BucketName}"
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: "s3:ObjectCreated:*"
            Function: !GetAtt LambdaTrigger.Arn