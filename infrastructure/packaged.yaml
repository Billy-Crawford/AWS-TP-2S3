AWSTemplateFormatVersion: '2010-09-09'
Description: TP AWS Lambda - S3 Trigger + DynamoDB
Parameters:
  Environment:
    Type: String
    Default: ongartobaye
  BucketName:
    Type: String
    Default: s3-bucket-trigger-lambda
Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName:
          Fn::Sub: ${Environment}-LambdaDynamoPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            Resource:
            - arn:aws:dynamodb:*:*:table/s3-trigger-db
          - Effect: Allow
            Action:
            - s3:GetObject
            Resource:
            - Fn::Sub: arn:aws:s3:::${Environment}-${BucketName}/*
  LambdaTrigger:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName:
        Fn::Sub: ${Environment}-S3LambdaTrigger
      Handler: main.lambda_handler
      Runtime: python3.12
      Role:
        Fn::GetAtt:
        - LambdaExecutionRole
        - Arn
      Environment:
        Variables:
          PK_VALUE: ongartobaye
          TABLE_NAME: s3-trigger-db
      Code:
        S3Bucket: my-lambda-artifacts-ongartobaye
        S3Key: ccf7e910aef34f6491369cc376d0a1ca
  LambdaPermissionForS3:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: LambdaTrigger
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn:
        Fn::Sub: arn:aws:s3:::${Environment}-${BucketName}
  S3Bucket:
    Type: AWS::S3::Bucket
    DependsOn:
    - LambdaPermissionForS3
    Properties:
      BucketName:
        Fn::Sub: ${Environment}-${BucketName}
      NotificationConfiguration:
        LambdaConfigurations:
        - Event: s3:ObjectCreated:*
          Function:
            Fn::GetAtt:
            - LambdaTrigger
            - Arn
